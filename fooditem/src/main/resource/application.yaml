spring:
  application:
    name: lncr-ms-food-item
    jackson:
      default-property-inclusion: non_null
      serialization:
        write-dates-as-timestamps: false
  datasource:
    url: "${POSTGRES_URL}"
    username: "${POSTGRES_USER}"
    password: "${POSTGRES_PASSWORD}"
    driver-class-name: org.postgresql.Driver

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
server:
  port: 8080
lncr:
  internal-url: "${LNCR_INTERNAL_URL:http://localhost:8080}"
  external-url: "${LNCR_EXTERNAL_URL:http://localhost:8080}"
  food-item:
    location-prefix: "${lncr.external-url}/foodItems"
    max-images: 5
    image:
      location-prefix: "${lncr.external-url}/foodItems/image"
      directory: "/app/images/"
      maxSize: 524288 # 512 KB
      allowed-extensions:
        ".jpg": "FFD8"
        ".png": "89504E47"


